    env:
       SECRET_KEY: l-ckzDB-JVHGAapJ4c_D-EdxJScyGWUeJs-5MK0wxGHsYvtfL6lZAmwrt7q22p3_axo
       DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

